---
layout: default
---
.post-container {
  max-width: 800px; /* or 800pt */
  width: 100%;
  margin: 0 auto;  /* keeps the post centered on the screen */
}
<div class="post-content">
  <h1>
    {{ page.title }}
  </h1>
  {% if page.image %}
    <div class="featured-image">
      <img src="{{ site.github.url }}/assets/img/{{ page.image }}">
    </div>
  {% endif %}
  <article>
    {{ content }}
  </article>
</div>
