---
layout: default
---
<main class="page-content" style="padding-top: 40px; max-width: 680px; margin: 0 auto; padding-left: 20px; padding-right: 20px;">

  <header class="post-header" style="margin-bottom: 24px;">
    <h1 class="post-title" style="margin: 0; font-size: 2rem; font-weight: 700; text-align: left;">{{ page.title | escape }}</h1>
  </header>

  {% if page.image %}
    <div class="featured-image" style="margin-top: 24px; margin-bottom: 28px; text-align: center;">
      <img src="{{ site.github.url }}/assets/img/{{ page.image }}" alt="{{ page.title | escape }}" style="max-width: 100%; height: auto; display: inline-block; border-radius: 4px;">
    </div>
  {% endif %}

  <article class="post-content" style="text-align: left; font-size: 1rem; line-height: 1.6;">
    {{ content }}
  </article>

</main>
