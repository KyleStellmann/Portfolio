---
layout: default
---
<main class="page-content" style="padding-top: 80px; max-width: 800px; margin: 0 auto;">

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  {% if page.image %}
    <div class="featured-image">
      <img src="{{ site.github.url }}/assets/img/{{ page.image }}" alt="{{ page.title | escape }}">
    </div>
  {% endif %}

  <article class="post-content">
    {{ content }}
  </article>

</main>
