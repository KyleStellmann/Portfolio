---
layout: default
---
<main class="page-content" style="padding-top: 80px; max-width: 800px; margin: 0 auto;">

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</main>
<div class="post-content">
  <h1>
    {{ page.title }}
  </h1>
  {% if page.image %}
    <div class="featured-image">
      <img src="{{ site.github.url }}/assets/img/{{ page.image }}">
    </div>
  {% endif %}
  <article>
    {{ content }}
  </article>
</div>
