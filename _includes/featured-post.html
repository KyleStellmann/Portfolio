<style>
  .project-card {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .project-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
  }
</style>

<!-- HERO / INTRO POST (First loop item) -->
{% if forloop.first %}
<div style="width: 100%; box-sizing: border-box; background: #ffffff; text-align: left; font-family: 'Times New Roman', Times, serif; padding: 10px 0 40px 0; border-bottom: 2px solid #e5e7eb; margin-bottom: 40px;">
  
  <h2 style="font-family: 'Times New Roman', Times, serif; font-size: 2.5rem; margin: 0 0 15px 0; color: #000000; line-height: 1.1; font-weight: normal;">
    <a href="{{ site.github.url }}{{ post.url }}" style="color: inherit; text-decoration: none;">{{ post.title }}</a>
  </h2>

  {% if post.image %}
    <div style="margin-bottom: 20px;">
      <a href="{{ site.github.url }}{{ post.url }}">
        <img src="{{ site.github.url }}/assets/img/{{ post.image }}" alt="{{ post.title }}" style="height: 450px; width: auto; max-width: 100%; object-fit: contain; display: block; margin: 0 0;">
      </a>
    </div>
  {% endif %}

  <div style="display: flex; gap: 12px; justify-content: flex-start; margin-top: 20px; align-items: center;">
    <a href="mailto:stell98@rowan.edu" style="background: #000000; color: #ffffff; padding: 10px 22px; text-decoration: none; border-radius: 0px; font-weight: bold; font-size: 0.95rem; display: inline-block; font-family: 'Times New Roman', Times, serif; border: 1px solid #000000; box-sizing: border-box;">Contact Me</a>
    <a href="{{ site.github.url }}/projects/" style="background: #ffffff; color: #000000; padding: 10px 22px; text-decoration: none; border-radius: 0px; font-weight: bold; font-size: 0.95rem; display: inline-block; font-family: 'Times New Roman', Times, serif; border: 1px solid #000000; box-sizing: border-box;">Projects</a>
  </div>

</div>

<!-- Opening wrapper for subsequent project grid items -->
<h3 style="font-family: 'Times New Roman', Times, serif; font-size: 1.8rem; margin: 0 0 20px 0; font-weight: normal; width: 100%;">Featured Engineering Projects</h3>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; width: 100%; box-sizing: border-box;">
{% endif %}

<!-- SUBSEQUENT PROJECT POSTS -->
{% if forloop.first == false %}
<div class="project-card" style="border: 1px solid #e2e8f0; border-radius: 6px; padding: 18px; background: #ffffff; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Times New Roman', Times, serif;">

  {% if post.image %}
    <a href="{{ site.github.url }}{{ post.url }}" style="display: block; width: 100%; height: 200px; overflow: hidden; margin-bottom: 15px;">
      <img src="{{ site.github.url }}/assets/img/{{ post.image }}" alt="{{ post.title }}" style="width: 100%; height: 100%; object-fit: contain; display: block;">
    </a>
  {% endif %}

  <h3 style="font-family: 'Times New Roman', Times, serif; font-size: 1.1rem; margin: 0; font-weight: bold; text-align: center;">
    <a href="{{ site.github.url }}{{ post.url }}" style="color: inherit; text-decoration: none;">{{ post.title }}</a>
  </h3>

</div>
{% endif %}

<!-- Close grid div on the last item -->
{% if forloop.last %}
</div>
{% endif %}
