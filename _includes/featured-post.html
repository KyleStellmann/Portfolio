<div style="max-width: 1000px; margin: 0 auto; padding: 40px 20px; box-sizing: border-box; background: #ffffff; text-align: center; font-family: 'Times New Roman', Times, serif;">

  <!-- 1. Title Header on Top -->
  <h2 style="font-family: 'Times New Roman', Times, serif; font-size: 2.5rem; margin: 0 0 25px 0; color: #000000; line-height: 1.1; font-weight: normal; text-align: center;">
    <a href="{{ site.github.url }}{{ post.url }}" style="color: inherit; text-decoration: none;">{{ post.title }}</a>
  </h2>

  <!-- 2. Centered Image Below Title -->
  {% if post.image %}
    <div style="margin-top: 25px; margin-bottom: 25px; text-align: center;">
      <a href="{{ site.github.url }}{{ post.url }}" style="display: inline-block;">
        <img src="{{ site.github.url }}/assets/img/{{ post.image }}" alt="{{ post.title }}" style="max-width: 100%; height: auto; display: block; margin: 0 auto;">
      </a>
    </div>
  {% endif %}

  <!-- 3. Action Buttons (Contact Me / Projects) -->
  {% if forloop.first %}
    <div style="display: flex; gap: 12px; justify-content: center; margin-top: 25px; align-items: center;">
      <a href="mailto:stell98@rowan.edu" style="background: #000000; color: #ffffff; padding: 10px 22px; text-decoration: none; border-radius: 0px; font-weight: bold; font-size: 0.95rem; display: inline-block; font-family: 'Times New Roman', Times, serif; border: 1px solid #000000; box-sizing: border-box;">Contact Me</a>
      <a href="#projects" style="background: #ffffff; color: #000000; padding: 10px 22px; text-decoration: none; border-radius: 0px; font-weight: bold; font-size: 0.95rem; display: inline-block; font-family: 'Times New Roman', Times, serif; border: 1px solid #000000; box-sizing: border-box;">Projects</a>
    </div>
  {% endif %}

</div>
