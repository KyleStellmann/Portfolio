<div class="featured-post" style="background-image:url('{{ site.github.url }}/assets/img/{{ post.image }}')">
  <div class="featured-header" style="text-align: left; left: 10%; transform: translateY(-50%);">
    <h2><span><a href="{{ site.github.url }}{{ post.url }}" style="color: inherit; text-decoration: none;">{{ post.title }}</a></span></h2>
    <div style="display: flex; gap: 10px; justify-content: flex-start; margin-top: 15px;">
      <a href="mailto:your-email@example.com" style="background: #000000; color: #ffffff; padding: 10px 20px; text-decoration: none; border-radius: 0px; font-weight: 600; font-size: 0.9rem; display: inline-block;">Contact Me</a>
      <a href="#projects" style="background: #ffffff; color: #000000; padding: 10px 20px; text-decoration: none; border-radius: 0px; font-weight: 600; font-size: 0.9rem; border: 1px solid #000000; display: inline-block;">Projects</a>
    </div>
  </div>
</div>
