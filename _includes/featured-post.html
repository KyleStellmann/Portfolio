<!-- MUST start with this -->
<div style="width: 100%; box-sizing: border-box; background: #ffffff; text-align: {% if forloop.first %}left{% else %}center{% endif %}; font-family: 'Times New Roman', Times, serif; {% if forloop.first %}padding: 10px 0 40px 0; border-bottom: 2px solid #e5e7eb; margin-bottom: 40px;{% else %}padding: 24px; margin-bottom: 28px; border: 1px solid #eaeeef; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.03);{% endif %}">

  <!-- 1. Title FIRST -->
  <h2 style="font-family: 'Times New Roman', Times, serif; font-size: {% if forloop.first %}2.5rem{% else %}1.4rem{% endif %}; margin: 0 0 15px 0; color: #000000; line-height: 1.2; font-weight: {% if forloop.first %}normal{% else %}bold{% endif %};">
    <a href="{{ site.github.url }}{{ post.url }}" style="color: inherit; text-decoration: none;">{{ post.title }}</a>
  </h2>

  <!-- 2. Image SECOND -->
  {% if post.image %}
    <div style="margin-bottom: 10px; display: flex; justify-content: center; align-items: center; {% if forloop.first %}{% else %}background: #fafafa; border-radius: 6px; padding: 15px;{% endif %}">
      <a href="{{ site.github.url }}{{ post.url }}">
        <img src="{{ site.github.url }}/assets/img/{{ post.image }}" alt="{{ post.title }}" style="height: {% if forloop.first %}450px{% else %}260px{% endif %}; width: auto; max-width: 100%; object-fit: contain; display: block; margin: {% if forloop.first %}0 0{% else %}0 auto{% endif %};">
      </a>
    </div>
  {% endif %}

  {% if forloop.first %}
    <div style="display: flex; gap: 12px; justify-content: flex-start; margin-top: 20px; align-items: center;">
      <a href="mailto:stell98@rowan.edu" style="background: #000000; color: #ffffff; padding: 10px 22px; text-decoration: none; border-radius: 0px; font-weight: bold; font-size: 0.95rem; display: inline-block; font-family: 'Times New Roman', Times, serif; border: 1px solid #000000; box-sizing: border-box;">Contact Me</a>
      <a href="{{ site.github.url }}/projects/" style="background: #ffffff; color: #000000; padding: 10px 22px; text-decoration: none; border-radius: 0px; font-weight: bold; font-size: 0.95rem; display: inline-block; font-family: 'Times New Roman', Times, serif; border: 1px solid #000000; box-sizing: border-box;">Projects</a>
    </div>
  {% endif %}

</div>
