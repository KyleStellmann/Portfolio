<div style="width: 100%; padding: 40px 10%; box-sizing: border-box; background: #ffffff; text-align: left; font-family: 'Times New Roman', Times, serif;">
  
  {% if post.image %}
    <div style="margin-bottom: 20px;">
      <img src="{{ site.github.url }}/assets/img/{{ post.image }}" alt="{{ post.title }}" style="max-width: 100%; height: auto; display: block;">
    </div>
  {% endif %}

  <h1 style="font-family: 'Times New Roman', Times, serif; font-size: 3rem; margin: 0 0 10px 0; color: #000000; line-height: 1.1; font-weight: normal;">
    {{ post.title }}
  </h1>

  <div style="display: flex; gap: 12px; justify-content: flex-start; margin-top: 20px; align-items: center;">
    <a href="mailto:your-email@example.com" style="background: #000000; color: #ffffff; padding: 10px 22px; text-decoration: none; border-radius: 0px; font-weight: bold; font-size: 0.95rem; display: inline-block; font-family: 'Times New Roman', Times, serif; border: 1px solid #000000; box-sizing: border-box;">Contact Me</a>
    <a href="#projects" style="background: #ffffff; color: #000000; padding: 10px 22px; text-decoration: none; border-radius: 0px; font-weight: bold; font-size: 0.95rem; display: inline-block; font-family: 'Times New Roman', Times, serif; border: 1px solid #000000; box-sizing: border-box;">Projects</a>
  </div>

</div>
