<header class="site-header">
  <h3 class="site-title">
    <a href="{{ site.github.url }}/">Home</a>
  </h3>
  <nav class="menu-list">
    {% for item in site.data.settings.menu %}
      <a href="{{ site.github.url }}/{{ item.url }}" class="menu-link">{{ item.name }}</a>
    {% endfor %}
    {% for item in site.data.settings.social %}
      <a href="{{ item.link }}" class="menu-link" target="_blank"><i class="fa fa-{{ item.icon }}" aria-hidden="true"></i></a>
    {% endfor %}
  </nav>
  <div class="dropdown">
    <button class="dropbtn"><i class="fa fa-bars" aria-hidden="true"></i></button>
    <div class="dropdown-content">
      {% for item in site.data.settings.menu %}
        <a href="{{ site.github.url }}/{{ item.url }}" class="menu-link">{{ item.name }}</a>
      {% endfor %}
      {% for item in site.data.settings.social %}
        <a href="{{ item.link }}" class="menu-link" target="_blank"><i class="fa fa-{{ item.icon }}" aria-hidden="true"></i></a>
      {% endfor %}
    </div>
  </div>
</header>

<style>
  /* Header layout and typography */
  .site-header {
    font-family: 'Times New Roman', Times, serif !important;
  }
  
  /* Styling for the Home link in top left */
  .site-title a {
    font-family: 'Times New Roman', Times, serif !important;
    font-weight: bold !important;
  }

  /* Target text links only, excluding icons */
  .menu-link {
    font-family: 'Times New Roman', Times, serif !important;
  }

  /* Protect Font Awesome icons from font overrides */
  .site-header .fa,
  .site-header i {
    font-family: 'FontAwesome', FontAwesome !important;
  }

  .wrapper, 
  .page-content, 
  main,
  .site-header .wrapper {
    max-width: 800px !important;
    width: 100% !important;
    margin-left: auto !important;
    margin-right: auto !important;
    padding-left: 20px !important;
    padding-right: 20px !important;
    box-sizing: border-box !important;
  }
</style>
